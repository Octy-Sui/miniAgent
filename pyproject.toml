[project]
name = "miniagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "octySui", email = "suiguangyuan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docker>=7.2.0",
    "jinja2>=3.1.6",
    "openai>=3.10.0",
    "orjson>=3.12.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0",
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["resume_local: real Local resume acceptance", "resume_docker: real Docker resume acceptance"]

[project.scripts]
miniagent = "miniagent.cli.main:entrypoint"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
