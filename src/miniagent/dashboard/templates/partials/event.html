<article id="event-{{ event.id }}" data-event-sequence="{{ event.sequence }}"{% if timeline.grouped %} data-step="{{ event.step }}"{% endif %}><h3>#{{ event.sequence }} · {{ event.type }}</h3><p>{{ event.summary }}{% if event.step is not none %} · Step {{ event.step }}{% if event.partial %}（局部，未加载完整 Step）{% endif %}{% endif %} · <a href="{{ event.href }}">定位来源</a></p>{% for issue in event.issues %}<p class="issue">{{ issue.message }}</p>{% endfor %}<details id="payload-{{ event.id }}"><summary>已脱敏 payload</summary><pre>{{ event.payload }}</pre></details></article>
