{% extends "base.html" %}{% block content %}<nav><a href="/runs">Runs</a> / {{ run_id }} · <a href="{{ workspace_href }}">Workspace</a></nav><h1>Run 详情</h1>
<form method="get" action="/runs/{{ run_id }}" id="event-filters"><label>Event 类型 <select name="type" multiple>{% for kind in event_types %}<option value="{{ kind }}"{% if kind in filters.types %} selected{% endif %}>{{ kind }}</option>{% endfor %}</select></label><label>Step <input name="step" type="number" min="1" value="{{ filters.step if filters.step is not none else '' }}"></label><label>工具名 <input name="tool_name" value="{{ filters.tool_name }}"></label><label><input type="checkbox" name="failures_only" value="true"{% if filters.failures_only %} checked{% endif %}>仅失败</label><label><input type="checkbox" name="grouped" value="true"{% if filters.grouped %} checked{% endif %}>按 Step 分组</label><button>筛选 / 刷新</button></form>
{% include "partials/run_database.html" %}{% endblock %}
