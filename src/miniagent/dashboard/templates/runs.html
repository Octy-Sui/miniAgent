{% extends "base.html" %}
{% block content %}<h1>Runs</h1>
<form id="run-filters" action="/runs" method="get"><label>任务 <input name="task" maxlength="200" value="{{ filters.get('task', '') }}"></label><label>模型 <input name="model" value="{{ filters.get('model', '') }}"></label><label>Run ID <input name="run_id" value="{{ filters.get('run_id', '') }}"></label><label>Workspace <select name="workspace"><option value="">全部</option>{% for kind in ('local','docker','unknown') %}<option value="{{ kind }}"{% if filters.get('workspace') == kind %} selected{% endif %}>{{ kind }}</option>{% endfor %}</select></label><label>状态 <select name="status"><option value="">全部</option>{% for status in ('created','running','waiting_approval','recovering','suspended','evaluating','succeeded','failed','cancelled') %}<option value="{{ status }}"{% if status in filters.get('statuses', []) %} selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>开始 UTC <input name="from" value="{{ filters.get('created_from', '') }}" placeholder="2026-10-19T00:00:00Z"></label><label>结束 UTC <input name="to" value="{{ filters.get('created_to', '') }}"></label><label>每页 <select name="page_size">{% for n in (10,25,50,100) %}<option{% if n == page_size %} selected{% endif %}>{{ n }}</option>{% endfor %}</select></label><button type="submit">筛选</button><a href="/runs">清除筛选</a></form>
{% include "partials/run_list.html" %}{% endblock %}
